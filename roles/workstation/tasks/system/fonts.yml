- name: system | fonts | install fonts
  tags: system,fonts
  package:
    name:
      - ttf-jetbrains-mono              # JetBrains Mono
      - ttf-font-awesome                # Font Awesome: iconic font designed for Bootstrap (woff2 format)
      - otf-font-awesome                # Font Awesome: iconic font designed for Bootstrap (otf format) (used by Waybar)
      - ttf-firacode-nerd               # Nerd Fonts: Fira (Fura) Code (used by Waybar)
      - ttf-ubuntu-font-family          # Ubuntu Font Family
      - noto-fonts                      # Google Noto TTF
      - noto-fonts-emoji                # Google Noto Emoji
      - ttf-nerd-fonts-symbols-mono     # Nerd Fonts (monospace) --> used by Emacs doom-modeline
      - ttf-material-symbols-variable   # Material Design icons by Google (used in Waybar)
      #- ttf-nerd-fonts-symbols          # Nerd Fonts

- name: system | fonts | install fonts from AUR
  tags: system,fonts
  become_user: aurman
  kewlfft.aur.aur:
    name:
      - ttf-all-the-icons  # used by Emacs
      - ttf-fast-font-git  # bionic reading like open fonts
  when: ansible_facts['distribution'] == "Archlinux"

- name: system | fonts | install Font Manager
  tags: system,fonts
  package:
    name:
      - font-manager

- name: system | fonts | install emoji picker
  tags: system,fonts
  become_user: aurman
  kewlfft.aur.aur:
    name: emote
  when: ansible_facts['distribution'] == "Archlinux"

- name: system | icons | install icons
  tags: system,icons
  package:
    name:
      - papirus-icon-theme  # used by rofi

- name: system | icons | copy icon directory
  tags:
    - eww
    - icon
    - waybar
    - widgets
  copy:
    remote_src: yes
    src: /home/ansible/git/dotfiles/icon/
    dest: /home/rafael/.config/icon/
    owner: rafael
    group: rafael
    mode: 0700
