- name: software | output profile | install kanshi & nwg-displays
  tags: output,kanshi
  package:
    name:
      - nwg-displays  # GUI for output management in Sway/Hyprland
      - kanshi        # daemon for dynamic automatic output profile for Wayland
      - #wdisplays    # GUI for configuring Wayland outputs
      - #wlr-randr    # CLI for managing outputs in Wayland

- name: software | output profile | ensure kanshi dirs exist
  tags: output,kanshi
  file:
    path: /home/rafael/.config/{{ item }}
    state: directory
    owner: rafael
    group: rafael
    mode: 0700
  with_items:
    - kanshi
    - systemd/user
