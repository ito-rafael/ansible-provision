#----------------------------------
# read-only block
#----------------------------------

- name: software | email | check if tbkeys is already configured
  tags: email,betterbird
  become_user: rafael
  ansible.builtin.stat:
    path: "/home/rafael/.thunderbird/default/.tbkeys_configured"
  register: tbkeys_marker

- name: software | email | check if Betterbird is running
  tags: email,betterbird
  ansible.builtin.command: set -o pipefail && pgrep -a -i "betterbird"
  failed_when: false
  changed_when: false
  register: betterbird_running

#----------------------------------
# gatekeeper: abort if needed
#----------------------------------

- name: software | email | abort if Betterbird is currently open
  tags: email,betterbird
  ansible.builtin.fail:
    msg: >
      [ABORTED] Betterbird is currently running and tbkeys configuration is pending!
      Please close the application manually and re-run the playbook to apply the changes safely.
  when:
    - betterbird_running.rc == 0
    - not tbkeys_marker.stat.exists

#----------------------------------
# write block (burn-in & scripts)
#----------------------------------

- name: software | email | initial burn-in and add-on configuration
  tags: email,betterbird
  block:
    - name: software | email | run Xvfb to burn-in profile and force add-on downloads
      become_user: rafael
      ansible.builtin.shell: |
        # launch a full GUI session invisibly in a virtual buffer
        xvfb-run -a betterbird > /dev/null 2>&1 &
        # give Betterbird 20 seconds to boot, parse policies.json, and download tbkeys
        sleep 20
        # gracefully ask the core engine to shut down
        killall -15 betterbird-bin || killall -15 betterbird || true
        # give Betterbird internal engine 5 seconds to flush preferences to disk
        sleep 5

    - name: software | email | wait for OS to release profile file locks
      become_user: rafael
      ansible.builtin.pause:
        seconds: 3

    - name: software | email | run Python script to configure tbkeys via IPC
      become_user: rafael
      # the Python script already uses xvfb-run natively via Selenium,
      # but running it inside xvfb-run here ensures absolute headlessness in Ansible.
      ansible.builtin.command: "xvfb-run -a python3 /home/ansible/git/dotfiles/betterbird/script_config_tbkeys.py"
      register: python_execution
      changed_when: "'Success' in python_execution.stdout"
  when:
    - not tbkeys_marker.stat.exists
