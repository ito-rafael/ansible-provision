- name: development | container-podman | enable user-level socket via systemd service
  tags: dev,container,podman
  become_user: rafael
  systemd:
    name: podman.socket
    state: started
    enabled: true
    scope: user

- name: development | emacs | try-restart systemd global service
  tags: emacs
  ansible.builtin.command: systemctl try-restart emacs.service --user
